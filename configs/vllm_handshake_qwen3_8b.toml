[benchmark]
name = "rmwbench-vllm-admission-bind-qwen3-8b"
seed = 7

[dataset]
files = 8
blocks_per_file = 32

[payload]
target_tokens = 320
tolerance = 0.15
anchors_per_block = 4

[agents]
count = 8

[run]
operations = 64
scheduler = "concurrent"
invalid_write_policy = "reject"
max_retries = 3
mock_delay_ms = 0.0

[reasoning]
candidate_facts = 4
relevant_facts = 2
candidate_targets = 8

[conflict]
mode = "exact"
ww_rate = 1.0
rw_rate = 0.50

[storage]
write_validation = "basis_occ"
hash = "sha256"

[txserve]
mode = "vllm_lease"
aging_factor = 0.01
max_batch_size = 8

[model]
backend = "vllm"
base_url = "http://127.0.0.1:18080/v1"
name = "qwen3-8b"
max_tokens = 64
timeout_seconds = 120.0
admission_lease_seconds = 300.0
